[project]
name = "ceres-ebaf-toa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "bokeh>=3.10.0",
    "boto3>=1.43.73",
    "coiled>=1.135.3",
    "dask>=2026.7.1",
    "distributed>=2026.7.1",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "icechunk>=2.1.1",
    "ipykernel>=7.3.0",
    "ipython>=9.15.0",
    "jupyter>=1.1.1",
    "jupyter-server-proxy>=4.5.0",
    "netcdf4>=1.7.4",
    "obstore>=0.11.0",
    "pooch>=1.9.0",
    "topozarr>=0.1.5",
    "virtualizarr>=2.7.1",
    "xarray>=2026.7.0",
    "xproj>=0.2.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.11",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
